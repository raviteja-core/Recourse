services:
  - type: web
    name: recourse
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/analytics/kpis
    envVars:
      - key: NODE_ENV
        value: production
      - key: REPLAY_ONLY
        value: "true"
      - key: NODE_VERSION
        value: "20.18.0"
